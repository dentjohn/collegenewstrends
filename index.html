<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Signal Intelligence</title>
<meta name="description" content="AI-powered institutional signal detection for U.S. universities. Analyze 10 risk and opportunity categories from real news.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c;--sf:#0f1118;--sf2:#161924;--sf3:#1e2233;--bd:#252a3a;--bdh:#353d55;
  --t1:#e4e8f4;--t2:#8b93ad;--t3:#545c74;--ac:#5b8def;--acd:rgba(91,141,239,0.1);
  --pos:#3dd68c;--neg:#ef6b6b;--mix:#e8b44a;--unc:#7e88a4;
  --posbg:rgba(61,214,140,0.06);--negbg:rgba(239,107,107,0.06);--mixbg:rgba(232,180,74,0.06);--uncbg:rgba(126,136,164,0.06);
  --posbd:rgba(61,214,140,0.2);--negbd:rgba(239,107,107,0.2);--mixbd:rgba(232,180,74,0.2);--uncbd:rgba(126,136,164,0.2);
  --serif:'Playfair Display',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);min-height:100vh}
::selection{background:var(--ac);color:#fff}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.03}

.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
.page::before{content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(ellipse,rgba(91,141,239,0.06) 0%,transparent 70%);pointer-events:none}

.brand-tag{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}
.brand h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-0.02em;line-height:1.1;margin-bottom:14px}
.brand p{font-size:15px;color:var(--t2);max-width:520px;margin:0 auto;line-height:1.6;font-weight:300}

.input-wrap{position:relative;width:100%;max-width:560px;margin-bottom:24px}
.input-wrap input{width:100%;padding:16px 140px 16px 24px;font-size:16px;font-family:var(--sans);background:var(--sf);border:1px solid var(--bd);border-radius:12px;color:var(--t1);outline:none;transition:border-color .2s,box-shadow .2s}
.input-wrap input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
.input-wrap input::placeholder{color:var(--t3);font-weight:300}
.input-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:10px 24px;font-family:var(--sans);font-size:14px;font-weight:600;background:var(--ac);color:#fff;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
.input-wrap button:hover{background:#7ba5f5}
.input-wrap button:disabled{opacity:0.5;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:560px;justify-content:center}
.chip{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--ac);color:var(--ac);background:var(--acd)}

.progress{position:fixed;inset:0;background:rgba(8,9,12,0.92);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center}
.progress-inner{max-width:520px;width:100%;padding:40px;text-align:center}
.spinner{width:48px;height:48px;border:3px solid var(--sf3);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 24px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
.pstep{display:flex;gap:12px;padding:6px 0;font-size:13px;align-items:flex-start}
.pdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;transition:background .3s}

.sc{min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,9,12,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar h2{font-family:var(--serif);font-size:17px;font-weight:600}
.btn-back{background:none;border:1px solid var(--bd);color:var(--t2);padding:6px 14px;border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s}
.btn-back:hover{border-color:var(--t2);color:var(--t1)}
.btn-pdf{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.06);color:#f87171;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-pdf:hover{border-color:rgba(239,68,68,0.6);background:rgba(239,68,68,0.12);color:#fca5a5;transform:translateY(-1px);box-shadow:0 4px 16px rgba(239,68,68,0.15)}

.sc-body{max-width:900px;margin:0 auto;padding:28px 28px 80px}
.banner{border-radius:12px;padding:22px 26px;margin-bottom:26px;border:1px solid;overflow:hidden}
.meta-line{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sig-badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 11px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.meta-tag{font-family:var(--mono);font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.cat-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:15px 17px;transition:border-color .2s}
.cat-card:hover{border-color:var(--bdh)}
.cat-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cat-lbl{flex:1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cat-pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:4px}
.finding{display:flex;gap:8px;padding:2px 0;align-items:flex-start;font-size:12.5px;color:var(--t2);line-height:1.6;font-weight:300}
.fdot{width:5px;height:5px;border-radius:50%;margin-top:6px;flex-shrink:0}
.fu-section{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px 22px;margin-bottom:26px}
.fu-section h3{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);font-weight:600;margin-bottom:10px}
.fu-item{font-family:var(--mono);font-size:12px;color:var(--t2);padding:4px 0 4px 16px;position:relative}
.fu-item::before{content:'\2192';position:absolute;left:0;color:var(--t3)}
.raw-section{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px 22px}
.raw-toggle{font-family:var(--mono);font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;padding:4px 0}
.raw-toggle:hover{color:var(--t2)}
.raw-body{margin-top:12px;font-size:12px;line-height:1.7;color:var(--t2);white-space:pre-wrap;display:none}
.raw-body.open{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sf3);color:var(--t1);padding:10px 20px;border-radius:8px;font-size:13px;border:1px solid var(--bd);z-index:1000;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.cat-grid{grid-template-columns:1fr}.sc-body{padding:20px 16px 60px}.topbar{padding:12px 16px}}
</style>
</head>
<body>

<div id="landingPage" class="page">
  <div class="brand" style="text-align:center;margin-bottom:44px;position:relative">
    <div class="brand-tag">Higher-Ed Intelligence</div>
    <h1>University Signal<br>Scorecard</h1>
    <p>AI-powered institutional signal detection across 10 risk and opportunity categories. Enter any U.S. university for a real-time intelligence briefing from the last 12 months of news.</p>
  </div>
  <div class="input-wrap">
    <input type="text" id="schoolInput" placeholder="e.g. Harvard University, Ohio State, MIT..." autocomplete="off">
    <button id="analyzeBtn" onclick="startAnalysis()">Analyze</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="progressPage" class="progress" style="display:none">
  <div class="progress-inner">
    <div class="spinner"></div>
    <h2 id="progSchool" style="font-family:var(--serif);font-size:22px;margin-bottom:8px"></h2>
    <div style="color:var(--t2);font-size:13px;margin-bottom:32px;font-weight:300">Scanning news sources across 10 signal categories</div>
    <div id="progSteps" style="text-align:left;max-width:380px;margin:0 auto"></div>
  </div>
</div>

<div id="scorecardPage" class="sc" style="display:none">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="btn-back" onclick="goBack()">&#8592; New Search</button>
      <h2 id="scName"></h2>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn-pdf" onclick="exportPDF()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
        Export PDF
      </button>
    </div>
  </div>
  <div class="sc-body" id="scBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ STATE ═══ */
let currentData=null,currentSchool='',currentRaw='';

const CATS=[
  {id:'lost_research_grants',label:'Lost Research Grants',icon:'\uD83D\uDD2C'},
  {id:'major_new_grants',label:'Major New Grants & Gifts',icon:'\uD83D\uDCB0'},
  {id:'enrollment_increase',label:'Enrollment Growth',icon:'\uD83D\uDCC8'},
  {id:'enrollment_decline',label:'Enrollment Decline',icon:'\uD83D\uDCC9'},
  {id:'senior_admin_turnover',label:'Leadership Turnover',icon:'\uD83D\uDD04'},
  {id:'scandals',label:'Scandals & Investigations',icon:'\u26A0\uFE0F'},
  {id:'budget_cuts',label:'Budget Cuts & Layoffs',icon:'\u2702\uFE0F'},
  {id:'accreditation_regulatory',label:'Accreditation / Regulatory',icon:'\uD83D\uDCCB'},
  {id:'labor_unrest',label:'Labor & Faculty Unrest',icon:'\u270A'},
  {id:'program_closures',label:'Program Closures',icon:'\uD83D\uDEAA'},
];
const CHIPS=['Harvard University','Stanford University','Ohio State University','University of Florida','NYU','West Virginia University','Howard University','Temple University'];
const SM={positive:'pos',negative:'neg',mixed:'mix',unclear:'unc'};
const SCOL={pos:'#3dd68c',neg:'#ef6b6b',mix:'#e8b44a',unc:'#7e88a4'};

/* ═══ UTILITIES ═══ */
function show(id){document.getElementById(id).style.display='';}
function hide(id){document.getElementById(id).style.display='none';}
function flash(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function h(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

/* ═══ LANDING ═══ */
document.getElementById('chips').innerHTML=CHIPS.map(s=>`<button class="chip" onclick="pickChip('${s}')">${s}</button>`).join('');
function pickChip(s){document.getElementById('schoolInput').value=s;startAnalysis();}
document.getElementById('schoolInput').addEventListener('keydown',e=>{if(e.key==='Enter')startAnalysis();});

/* ═══ ANALYSIS ═══ */
async function startAnalysis(){
  const name=document.getElementById('schoolInput').value.trim();
  if(!name)return;
  currentSchool=name;
  document.getElementById('analyzeBtn').disabled=true;
  hide('landingPage');show('progressPage');
  document.getElementById('progSchool').textContent=name;

  document.getElementById('progSteps').innerHTML=
    CATS.map((c,i)=>`<div class="pstep" id="ps${i}"><div class="pdot" style="background:var(--sf3)"></div><div>${c.icon} ${c.label}</div></div>`).join('')+
    `<div class="pstep" id="psSynth"><div class="pdot" style="background:var(--sf3)"></div><div>\uD83E\uDDE0 Synthesizing</div></div>`;

  let idx=0;
  const iv=setInterval(()=>{
    if(idx>0){const p=document.getElementById('ps'+(idx-1));if(p){p.style.color='var(--pos)';p.querySelector('.pdot').style.background='var(--pos)';p.querySelector('.pdot').style.animation='';}}
    if(idx<CATS.length){const c=document.getElementById('ps'+idx);c.style.color='var(--ac)';c.querySelector('.pdot').style.background='var(--ac)';c.querySelector('.pdot').style.animation='pu 1.5s infinite';}
    else if(idx===CATS.length){const s=document.getElementById('psSynth');s.style.color='var(--ac)';s.querySelector('.pdot').style.background='var(--ac)';}
    idx++;
  },2200);

  try{
    const resp=await fetch('/.netlify/functions/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({school:name})
    });
    const result=await resp.json();
    if(result.error)throw new Error(result.error);

    currentRaw=result.raw;
    clearInterval(iv);
    CATS.forEach((_,i)=>{const p=document.getElementById('ps'+i);p.style.color='var(--pos)';p.querySelector('.pdot').style.background='var(--pos)';p.querySelector('.pdot').style.animation='';});
    const sy=document.getElementById('psSynth');sy.style.color='var(--pos)';sy.querySelector('.pdot').style.background='var(--pos)';

    let data;
    try{data=JSON.parse(currentRaw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim());}
    catch{const m=currentRaw.match(/\{[\s\S]*\}/);if(m)data=JSON.parse(m[0]);else throw new Error('Could not parse AI response');}

    currentData=data;
    setTimeout(()=>{hide('progressPage');renderScorecard(data);show('scorecardPage');},600);
  }catch(err){
    clearInterval(iv);
    flash('Error: '+err.message);
    setTimeout(()=>{hide('progressPage');show('landingPage');document.getElementById('analyzeBtn').disabled=false;},2000);
  }
}

function goBack(){hide('scorecardPage');show('landingPage');document.getElementById('schoolInput').value='';document.getElementById('analyzeBtn').disabled=false;currentData=null;}

/* ═══ RENDER SCORECARD ═══ */
function renderScorecard(data){
  const sig=data.overall_signal||'unclear',sc=SM[sig]||'unc',col=SCOL[sc],cats=data.categories||{};
  document.getElementById('scName').textContent=data.school||currentSchool;
  const bgMap={pos:'var(--posbg)',neg:'var(--negbg)',mix:'var(--mixbg)',unc:'var(--uncbg)'};
  const bdMap={pos:'var(--posbd)',neg:'var(--negbd)',mix:'var(--mixbd)',unc:'var(--uncbd)'};

  let catCards='';
  CATS.forEach(cat=>{
    const cd=cats[cat.id]||{signal:'none',findings:['No data']};
    const cs=cd.signal||'none',csc=SM[cs]||'none',cc=SCOL[csc]||'#252a3a';
    const findings=(cd.findings||[]).map(f=>`<div class="finding"><div class="fdot" style="background:${csc!=='none'?cc:'var(--t3)'}"></div><div>${h(f)}</div></div>`).join('');
    catCards+=`<div class="cat-card" style="border-left:3px solid ${cc}"><div class="cat-top"><span style="font-size:16px">${cat.icon}</span><span class="cat-lbl">${cat.label}</span><span class="cat-pill" style="color:${csc!=='none'?cc:'var(--t3)'};background:${csc!=='none'?cc+'18':'var(--sf2)'}">${cs==='none'?'no signal':cs}</span></div><div>${findings}</div></div>`;
  });

  let followHtml='';
  if(data.follow_up_searches&&data.follow_up_searches.length)
    followHtml=`<div class="fu-section"><h3>Recommended Follow-Up Searches</h3>${data.follow_up_searches.map(s=>`<div class="fu-item">${h(s)}</div>`).join('')}</div>`;

  document.getElementById('scBody').innerHTML=`
    <div class="banner" style="border-color:${bdMap[sc]};background:${bgMap[sc]}">
      <div class="meta-line">
        <span class="sig-badge" style="color:${col};background:${col}20">${sig}</span>
        <span class="meta-tag">Strength: ${data.signal_strength||'\u2014'}</span>
        <span class="meta-tag">Confidence: ${data.confidence||'\u2014'}</span>
        <span class="meta-tag">Generated: ${new Date().toLocaleDateString()}</span>
      </div>
      <div style="font-size:14px;line-height:1.7;color:var(--t2);font-weight:300">${h(data.summary||'')}</div>
      ${data.why_it_matters?`<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--t3);font-style:italic">${h(data.why_it_matters)}</div>`:''}
    </div>
    <div class="cat-grid">${catCards}</div>
    ${followHtml}
    <div class="raw-section">
      <button class="raw-toggle" onclick="toggleRaw()">&#9656; Show raw AI response</button>
      <div class="raw-body" id="rawBody">${h(currentRaw)}</div>
    </div>`;
}

function toggleRaw(){const el=document.getElementById('rawBody');el.classList.toggle('open');el.previousElementSibling.textContent=el.classList.contains('open')?'\u25BE Hide raw AI response':'\u25B8 Show raw AI response';}

/* ═══ PDF GENERATOR — pure JS, zero dependencies ═══ */
function generatePDF(data){
  const school=data.school||'University',sig=data.overall_signal||'unclear',strength=data.signal_strength||'unknown',confidence=data.confidence||'unknown';
  const summary=data.summary||'',wim=data.why_it_matters||'',cats=data.categories||{},follows=data.follow_up_searches||[];
  const dateStr=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const sigCol={positive:'#2dbe7b',negative:'#e05555',mixed:'#d4a030',unclear:'#7e88a4'};
  const sigBg2={positive:'#0a1a10',negative:'#1a0a0a',mixed:'#1a150a',unclear:'#12141a'};
  function esc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
  function wrap(t,mx){const w=t.split(' '),l=[];let ln='';for(const x of w){if((ln+' '+x).trim().length>mx&&ln){l.push(ln.trim());ln=x;}else{ln=ln?ln+' '+x:x;}}if(ln.trim())l.push(ln.trim());return l;}
  function rgb(hex){return`${(parseInt(hex.slice(1,3),16)/255).toFixed(3)} ${(parseInt(hex.slice(3,5),16)/255).toFixed(3)} ${(parseInt(hex.slice(5,7),16)/255).toFixed(3)}`;}
  const W=612,H=792,M=54,TW=W-2*M;let pages=[],cur=[],y=H;
  function np(){if(cur.length)pages.push(cur.join('\n'));cur=[];y=H;cur.push(rgb('#08090c')+' rg');cur.push(`0 0 ${W} ${H} re f`);}
  function ft(){cur.push(rgb('#0f1118')+' rg');cur.push(`0 0 ${W} 24 re f`);cur.push('BT /F1 6 Tf');cur.push(rgb('#545c74')+' rg');cur.push(`${W/2-130} 8 Td (University Signal Intelligence  |  AI-Generated  |  Verify All Findings) Tj ET`);}
  function cp(n){if(y-n<50){ft();np();y=H-M;}}
  function tx(x,yy,f,sz,col,t){cur.push(`BT /F${f} ${sz} Tf ${rgb(col)} rg ${x} ${yy} Td (${esc(t)}) Tj ET`);}
  function bx(x,yy,w2,h2,col){cur.push(`${rgb(col)} rg ${x} ${yy} ${w2} ${h2} re f`);}
  np();
  bx(0,H-32,W,32,'#0f1118');tx(M,H-22,2,7,'#545c74','UNIVERSITY SIGNAL INTELLIGENCE');tx(W-M-190,H-22,1,7,'#545c74','CONFIDENTIAL BRIEFING  |  '+dateStr);y=H-52;
  for(const ln of wrap(school,42)){cp(28);tx(M,y,2,24,'#e4e8f4',ln);y-=28;}
  y+=4;tx(M,y,1,9,'#545c74','U.S. News Top 250  |  Signal Scorecard');y-=18;
  cur.push(`0.165 0.188 0.227 RG 0.5 w ${M} ${y} m ${W-M} ${y} l S`);y-=16;
  const sl=wrap(summary,85),wl=wim?wrap(wim,90):[];const bh=38+sl.length*14+(wl.length?wl.length*12+18:0);
  cp(bh+10);bx(M,y-bh,TW,bh,sigBg2[sig]||'#12141a');bx(M+10,y-19,65,14,sigCol[sig]||'#7e88a4');
  tx(M+16,y-16,2,8,'#08090c',sig.toUpperCase());tx(M+80,y-15,1,7,'#545c74',`STRENGTH: ${strength.toUpperCase()}   |   CONFIDENCE: ${confidence.toUpperCase()}`);
  let sy2=y-34;for(const ln of sl){tx(M+10,sy2,1,10,'#8b93ad',ln);sy2-=14;}
  if(wl.length){sy2-=6;tx(M+10,sy2,2,7,'#5b8def','WHY IT MATTERS');sy2-=14;for(const ln of wl){tx(M+10,sy2,3,9,'#6b7394',ln);sy2-=12;}}
  y-=bh+14;cp(18);tx(M,y,2,8,'#5b8def','SIGNAL CATEGORIES');y-=14;
  for(const cat of CATS){const cd=cats[cat.id]||{signal:'none',findings:['No significant developments found']};const cs=cd.signal||'none',findings=cd.findings||[],barC=sigCol[cs]||'#252a3a';
    let ch=22;for(const f of findings){ch+=wrap(f,80).length*11;}ch=Math.max(ch,28)+4;cp(ch+6);bx(M,y-ch,TW,ch,'#0f1118');bx(M,y-ch,2.5,ch,barC);
    tx(M+10,y-13,2,7.5,'#e4e8f4',cat.label.toUpperCase());tx(W-M-60,y-12,2,6.5,sigCol[cs]||'#545c74',cs==='none'?'NO SIGNAL':cs.toUpperCase());
    let fy=y-26;for(const f of findings){cur.push(`${rgb(sigCol[cs]||'#545c74')} rg ${M+12} ${fy+1.5} 3 3 re f`);for(const fl of wrap(f,80)){tx(M+20,fy,1,8.5,'#8b93ad',fl);fy-=11;}}y-=ch+5;}
  if(follows.length){cp(18+follows.length*13);y-=4;cur.push(`0.165 0.188 0.227 RG ${M} ${y} m ${W-M} ${y} l S`);y-=16;
    tx(M,y,2,8,'#5b8def','RECOMMENDED FOLLOW-UP SEARCHES');y-=14;for(const s of follows){cp(13);tx(M+8,y,4,8,'#8b93ad','-> '+s);y-=13;}}
  cp(40);y-=8;cur.push(`0.165 0.188 0.227 RG ${M} ${y} m ${W-M} ${y} l S`);y-=14;
  for(const ln of wrap('This report was generated by AI using automated web search. All findings should be independently verified. This document is for analytical purposes only.',100)){tx(M,y,3,6.5,'#3d4460',ln);y-=9;}
  ft();pages.push(cur.join('\n'));
  const np2=pages.length,kids=[];for(let i=0;i<np2;i++)kids.push(`${8+i*2} 0 R`);
  let pdf='%PDF-1.4\n';const off=[];
  function wo(n,c){off.push(pdf.length);pdf+=`${n} 0 obj\n${c}\nendobj\n`;}
  wo(1,'<< /Type /Catalog /Pages 2 0 R >>');wo(2,`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${np2} >>`);
  wo(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');wo(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
  wo(5,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique >>');wo(6,'<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>');
  const fr='/F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R';
  for(let i=0;i<np2;i++){const sn=7+i*2,pn=8+i*2,c=pages[i];wo(sn,`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);wo(pn,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Contents ${sn} 0 R /Resources << /Font << ${fr} >> >> >>`);}
  const xr=pdf.length;pdf+=`xref\n0 ${off.length+1}\n0000000000 65535 f \n`;for(const o of off)pdf+=`${String(o).padStart(10,'0')} 00000 n \n`;
  pdf+=`trailer\n<< /Size ${off.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;return pdf;
}

function exportPDF(){
  if(!currentData){flash('No analysis to export');return;}
  try{const pdfStr=generatePDF(currentData);const bytes=new Uint8Array(pdfStr.length);for(let i=0;i<pdfStr.length;i++)bytes[i]=pdfStr.charCodeAt(i)&0xff;
    const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
    const safe=(currentData.school||'University').replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'_').substring(0,40);
    a.download=`Signal_Scorecard_${safe}.pdf`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);flash('PDF downloaded');
  }catch(e){flash('PDF error: '+e.message);}
}
